plugins {
    id 'com.android.application'
}

android {
    namespace 'app.calmtv.home'
    compileSdk 34

    defaultConfig {
        applicationId "app.calmtv.home"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
