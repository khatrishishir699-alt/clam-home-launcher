name: Build Calm Home APK

# Free way to build the APK without installing Android Studio:
# put the contents of the "launcher" folder in a new GitHub repository, open the
# Actions tab, run "Build Calm Home APK", then download the "CalmHome-apk" artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk CalmHome.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CalmHome-apk
          path: CalmHome.apk
